[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotwin-triworld-train"
version = "1.0.0"
description = "Portable Robotwin episode and future-video window datasets for TriWorldBench model training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "h5py>=3.8,<4",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]
torch = ["torch>=2.4"]

[project.scripts]
triworld-train = "triworld_train.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["triworld_train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
